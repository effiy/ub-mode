[project]
name = "ub-tools"
version = "0.1.0"
description = "UB-Mode Quality Gate Tools: crapper (CRAP scoring), dryer (duplicate detection), mutator (mutation testing) — for use in DSH environments."
readme = "README.md"
license = { text = "MIT" }
classifiers = ["License :: OSI Approved :: MIT License"]
requires-python = ">=3.11"
dependencies = [
    "tree-sitter>=0.24",
    "tree-sitter-language-pack>=0.7",
]

[project.scripts]
crapper = "ub_tools.crapper:main"
dryer   = "ub_tools.dryer:main"
mutator = "ub_tools.mutator:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]